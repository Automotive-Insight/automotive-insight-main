        <a class="blog-card{{CARD_CLASS}}" href="/blog/{{SLUG}}/" data-cat="{{CATEGORY_KEY}}">
          <div class="blog-card-img"><img src="{{IMAGE}}" alt="{{IMAGE_ALT}}" width="1200" height="675" loading="lazy" decoding="async"></div>
          <div class="blog-card-text">
            <p class="blog-card-cat">{{CATEGORY_SHORT}}</p>
            <{{TITLE_TAG}} class="blog-card-title">{{TITLE}}</{{TITLE_TAG}}>
            <p class="blog-card-excerpt">{{TAGLINE}}</p>
            <p class="blog-card-meta"><time datetime="{{DATE_ISO}}">{{DATE_HUMAN}}</time> · {{READ_MINS}} min read</p>
          </div>
        </a>
